<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart AI - تطبيق الذكاء الاصطناعي</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background-color: #1e293b; padding: 30px; border-radius: 12px; width: 90%; max-width: 500px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h2 { text-align: center; margin-bottom: 20px; color: #38bdf8; }
        input[type="email"], input[type="password"], input[type="text"] { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #334155; background-color: #0f172a; color: white; outline: none; }
        button { width: 100%; padding: 12px; background-color: #0284c7; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 10px; transition: 0.3s; }
        button:hover { background-color: #0369a1; }
        .switch-form { text-align: center; margin-top: 15px; color: #94a3b8; cursor: pointer; font-size: 14px; }
        .switch-form:hover { color: #38bdf8; }
        #chat-section { display: none; }
        .chat-box { background-color: #0f172a; height: 300px; border-radius: 6px; overflow-y: auto; padding: 15px; margin-bottom: 15px; border: 1px solid #334155; }
        .message { margin-bottom: 15px; padding: 10px; border-radius: 6px; max-width: 80%; }
        .user-msg { background-color: #0284c7; align-self: flex-start; margin-left: auto; }
        .ai-msg { background-color: #334155; align-self: flex-end; margin-right: auto; }
        .chat-input-group { display: flex; gap: 10px; }
        .chat-input-group input { margin: 0; }
        .chat-input-group button { margin: 0; width: 80px; }
    </style>
</head>
<body>

    <!-- قسم تسجيل الدخول وإنشاء الحساب -->
    <div class="container" id="auth-section">
        <h2 id="form-title">تسجيل الدخول</h2>
        <form id="auth-form">
            <input type="email" id="email" placeholder="البريد الإلكتروني" required>
            <input type="password" id="password" placeholder="كلمة المرور" required>
            <button type="submit" id="submit-btn">دخول</button>
        </form>
        <div class="switch-form" id="switch-mode">ليس لديك حساب؟ إنشاء حساب جديد</div>
    </div>

    <!-- قسم الدردشة مع الذكاء الاصطناعي -->
    <div class="container" id="chat-section">
        <h2>Smart AI</h2>
        <div class="chat-box" id="chat-box">
            <!-- الرسائل ستظهر هنا -->
        </div>
        <form class="chat-input-group" id="chat-form">
            <input type="text" id="chat-input" placeholder="اكتب سؤالك هنا..." required>
            <button type="submit">إرسال</button>
        </form>
    </div>

    <script>
        let isLoginMode = true;
        
        const authSection = document.getElementById('auth-section');
        const chatSection = document.getElementById('chat-section');
        const authForm = document.getElementById('auth-form');
        const switchModeBtn = document.getElementById('switch-mode');
        const formTitle = document.getElementById('form-title');
        const submitBtn = document.getElementById('submit-btn');

        // التبديل بين تسجيل الدخول وإنشاء الحساب
        switchModeBtn.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            formTitle.textContent = isLoginMode ? 'تسجيل الدخول' : 'إنشاء حساب جديد';
            submitBtn.textContent = isLoginMode ? 'دخول' : 'تسجيل';
            switchModeBtn.textContent = isLoginMode ? 'ليس لديك حساب؟ إنشاء حساب جديد' : 'لديك حساب بالفعل؟ تسجيل الدخول';
        });

        // التعامل مع فورم الدخول/التسجيل (بدون استخدام localhost)
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const endpoint = isLoginMode ? '/api/login' : '/api/register';

            submitBtn.textContent = 'جاري التحميل...';
            submitBtn.disabled = true;

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.success) {
                    alert(isLoginMode ? 'تم تسجيل الدخول بنجاح!' : 'تم إنشاء الحساب بنجاح!');
                    authSection.style.display = 'none';
                    chatSection.style.display = 'block';
                } else {
                    alert(data.error || 'حدث خطأ في البيانات');
                }
            } catch (error) {
                alert('خطأ في الاتصال بالخادم');
            } finally {
                submitBtn.textContent = isLoginMode ? 'دخول' : 'تسجيل';
                submitBtn.disabled = false;
            }
        });

        // التعامل مع إرسال الرسائل للذكاء الاصطناعي
        const chatForm = document.getElementById('chat-form');
        const chatBox = document.getElementById('chat-box');
        const chatInput = document.getElementById('chat-input');

        function appendMessage(text, className) {
            const div = document.createElement('div');
            div.className = 'message ' + className;
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const prompt = chatInput.value;
            if (!prompt) return;

            // عرض رسالة المستخدم
            appendMessage(prompt, 'user-msg');
            chatInput.value = '';

            try {
                // الاتصال بمسار الذكاء الاصطناعي
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });

                const data = await response.json();

                if (data.success) {
                    appendMessage(data.text, 'ai-msg');
                } else {
                    appendMessage('خطأ: ' + (data.error || 'فشل في جلب الرد'), 'ai-msg');
                }
            } catch (error) {
                appendMessage('خطأ في الاتصال بالخادم', 'ai-msg');
            }
        });
    </script>
</body>
</html>
