<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
<meta name="theme-color" content="#6C5CE7" />
<title>Smart AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --primary: #6C5CE7;
    --primary-dark: #5341C9;
    --accent: #00D2A1;
    --bg: #F4F5FB;
    --bg-2: #EBEDF7;
    --card: #FFFFFF;
    --card-2: #FAFBFF;
    --text: #1A1D2E;
    --text-2: #5A5F7D;
    --muted: #8E93AE;
    --border: #E5E8F3;
    --shadow: 0 4px 20px rgba(26, 29, 46, 0.06);
    --radius-sm: 12px;
    --radius-lg: 24px;
    --gradient: linear-gradient(135deg, #6C5CE7 0%, #A29BFE 100%);
  }

  body.dark {
    --bg: #0E0F1A;
    --bg-2: #161825;
    --card: #1A1D2E;
    --card-2: #212438;
    --text: #F4F5FB;
    --text-2: #B8BCD4;
    --muted: #7C8099;
    --border: #2A2E45;
    --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
  }

  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: 'IBM Plex Sans Arabic', 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    transition: background 0.3s ease, color 0.3s ease;
    -webkit-font-smoothing: antialiased;
  }

  body[dir="ltr"] { font-family: 'Inter', 'IBM Plex Sans Arabic', sans-serif; }

  /* ===== AUTH SCREEN ===== */
  #authScreen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    position: relative;
  }

  #authScreen .bg-orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.35;
    pointer-events: none;
  }
  #authScreen .bg-orb.o1 { width: 400px; height: 400px; background: #6C5CE7; top: -150px; right: -100px; }
  #authScreen .bg-orb.o2 { width: 350px; height: 350px; background: #00D2A1; bottom: -150px; left: -100px; opacity: 0.2; }

  .auth-card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 36px 28px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 20px 60px rgba(108, 92, 231, 0.15);
  }

  .auth-logo {
    text-align: center;
    margin-bottom: 24px;
  }
  .auth-logo .icon {
    width: 60px; height: 60px;
    border-radius: 18px;
    background: var(--gradient);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 1.8rem;
    margin-bottom: 12px;
    box-shadow: 0 12px 40px rgba(108, 92, 231, 0.35);
  }
  .auth-logo h1 {
    font-size: 1.6rem;
    font-weight: 800;
    background: var(--gradient);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .auth-logo p {
    font-size: 0.88rem;
    color: var(--muted);
    margin-top: 4px;
  }

  .auth-tabs {
    display: flex;
    background: var(--bg-2);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 20px;
  }
  .auth-tab {
    flex: 1;
    padding: 10px;
    text-align: center;
    font-size: 0.9rem;
    font-weight: 600;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--text-2);
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s ease;
  }
  .auth-tab.active {
    background: var(--card);
    color: var(--primary);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
  }

  .form-field { margin-bottom: 14px; }
  .form-field label {
    display: block;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text-2);
    margin-bottom: 6px;
  }
  .form-field input {
    width: 100%;
    padding: 13px 15px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--card-2);
    color: var(--text);
    font-size: 0.95rem;
    font-family: inherit;
    outline: none;
    transition: all 0.2s ease;
  }
  .form-field input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.1);
    background: var(--card);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 20px;
    border-radius: 12px;
    border: none;
    font-size: 0.95rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s ease;
    width: 100%;
  }
  .btn-primary {
    background: var(--gradient);
    color: #fff;
    box-shadow: 0 8px 24px rgba(108, 92, 231, 0.35);
  }
  .btn-primary:hover:not(:disabled) { transform: translateY(-2px); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

  .btn-google {
    background: #fff;
    color: #333;
    border: 1.5px solid #ddd;
    box-shadow: none;
  }
  .btn-google:hover { background: #f7f7f7; }
  .btn-google svg { width: 18px; height: 18px; }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 16px 0;
    color: var(--muted);
    font-size: 0.8rem;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .auth-error {
    background: rgba(255, 118, 117, 0.1);
    color: #E84393;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 0.85rem;
    margin-bottom: 14px;
    display: none;
  }
  .auth-error.show { display: block; }

  /* ===== MAIN APP ===== */
  #appScreen {
    display: none;
    height: 100vh;
    overflow: hidden;
  }
  #appScreen.show { display: flex; }

  /* Sidebar */
  .sidebar {
    width: 280px;
    background: var(--card);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100vh;
    transition: transform 0.3s ease;
    position: relative;
    z-index: 10;
  }
  body[dir="ltr"] .sidebar { border-left: none; border-right: 1px solid var(--border); }

  .sidebar-header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .sidebar-header .logo-mini {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: var(--gradient);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem;
  }
  .sidebar-header .title {
    flex: 1;
    font-weight: 800;
    font-size: 1rem;
    background: var(--gradient);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .new-chat-btn {
    margin: 12px 16px;
    padding: 12px;
    border-radius: 12px;
    background: var(--gradient);
    color: #fff;
    border: none;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 6px 18px rgba(108, 92, 231, 0.3);
    transition: all 0.2s ease;
  }
  .new-chat-btn:hover { transform: translateY(-1px); }

  .conv-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }
  .conv-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    margin-bottom: 4px;
    cursor: pointer;
    transition: all 0.15s ease;
    position: relative;
  }
  .conv-item:hover { background: var(--bg-2); }
  .conv-item.active { background: rgba(108, 92, 231, 0.1); }
  .conv-item .icon { font-size: 0.9rem; opacity: 0.7; }
  .conv-item .text {
    flex: 1;
    font-size: 0.88rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
  }
  .conv-item .menu-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1rem;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 6px;
    opacity: 0;
    transition: all 0.15s ease;
  }
  .conv-item:hover .menu-btn { opacity: 1; }
  .conv-item .menu-btn:hover { background: var(--border); }

  .sidebar-footer {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .user-avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--gradient);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    font-size: 0.85rem;
    flex-shrink: 0;
  }
  .user-info { flex: 1; overflow: hidden; }
  .user-email {
    font-size: 0.8rem;
    color: var(--text-2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .logout-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1.1rem;
    padding: 6px;
    border-radius: 8px;
    transition: background 0.15s;
  }
  .logout-btn:hover { background: var(--bg-2); }

  /* Chat area */
  .chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    background: var(--bg);
  }

  .chat-header {
    padding: 14px 20px;
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  body.dark .chat-header { background: rgba(14, 15, 26, 0.75); }

  .menu-toggle {
    display: none;
    background: none;
    border: none;
    font-size: 1.3rem;
    cursor: pointer;
    padding: 6px;
    color: var(--text);
  }

  .chat-title {
    flex: 1;
    font-weight: 600;
    font-size: 0.95rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .icon-btn {
    width: 38px; height: 38px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s ease;
    font-family: inherit;
    flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--bg-2); }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    text-align: center;
    color: var(--muted);
    padding: 40px 20px;
  }
  .empty-state .icon {
    font-size: 3.5rem;
    margin-bottom: 16px;
  }
  .empty-state h2 {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 6px;
  }
  .empty-state p { font-size: 0.9rem; }

  .msg {
    display: flex;
    gap: 12px;
    max-width: 100%;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .msg-avatar {
    width: 34px; height: 34px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem;
    flex-shrink: 0;
    font-weight: 700;
  }
  .msg.user .msg-avatar { background: var(--bg-2); color: var(--text); }
  .msg.ai .msg-avatar { background: var(--gradient); color: #fff; }

  .msg-body {
    flex: 1;
    padding: 14px 18px;
    border-radius: 14px;
    line-height: 1.75;
    font-size: 0.94rem;
    overflow-wrap: break-word;
    word-wrap: break-word;
  }
  .msg.user .msg-body {
    background: var(--card);
    border: 1px solid var(--border);
  }
  .msg.ai .msg-body {
    background: var(--card);
    border: 1px solid var(--border);
  }

  /* Markdown inside messages */
  .msg-body h1, .msg-body h2, .msg-body h3 {
    margin: 12px 0 6px;
    font-weight: 700;
    color: var(--primary);
  }
  .msg-body h1 { font-size: 1.2rem; }
  .msg-body h2 { font-size: 1.1rem; }
  .msg-body h3 { font-size: 1rem; }
  .msg-body p { margin-bottom: 10px; }
  .msg-body ul, .msg-body ol { margin: 6px 0 12px 20px; }
  body[dir="rtl"] .msg-body ul, body[dir="rtl"] .msg-body ol { margin: 6px 20px 12px 0; }
  .msg-body li { margin-bottom: 4px; }
  .msg-body strong { color: var(--primary); font-weight: 700; }
  .msg-body code {
    background: var(--bg-2);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: 'Courier New', monospace;
    font-size: 0.88em;
  }
  .msg-body pre {
    background: var(--bg-2);
    padding: 12px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 10px 0;
  }
  .msg-body pre code { background: none; padding: 0; }
  .msg-body hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  .msg-body blockquote {
    border-left: 3px solid var(--primary);
    padding-left: 12px;
    margin: 10px 0;
    color: var(--text-2);
    font-style: italic;
  }
  body[dir="rtl"] .msg-body blockquote {
    border-left: none;
    border-right: 3px solid var(--primary);
    padding-left: 0;
    padding-right: 12px;
  }

  .typing {
    display: inline-flex;
    gap: 4px;
    padding: 8px 0;
  }
  .typing span {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--primary);
    animation: typing 1.4s infinite;
    opacity: 0.4;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing {
    0%, 60%, 100% { opacity: 0.4; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-4px); }
  }

  .chat-input-area {
    padding: 16px 20px 20px;
    background: var(--bg);
  }
  .chat-input-wrap {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 8px 12px;
    max-width: 820px;
    margin: 0 auto;
    transition: border-color 0.2s;
  }
  .chat-input-wrap:focus-within {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.08);
  }
  .chat-input-wrap textarea {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    resize: none;
    font-size: 0.95rem;
    font-family: inherit;
    color: var(--text);
    padding: 8px 4px;
    max-height: 140px;
    line-height: 1.5;
  }
  .send-btn {
    width: 38px; height: 38px;
    border-radius: 10px;
    background: var(--gradient);
    color: #fff;
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem;
    flex-shrink: 0;
    transition: all 0.2s ease;
  }
  .send-btn:hover:not(:disabled) { transform: translateY(-1px); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 24px;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
  }
  .modal h3 {
    font-size: 1.05rem;
    font-weight: 700;
    margin-bottom: 16px;
  }
  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }
  .modal-actions .btn {
    flex: 1;
    padding: 10px;
    font-size: 0.9rem;
  }
  .btn-secondary {
    background: var(--bg-2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-danger {
    background: #FF7675;
    color: #fff;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .sidebar {
      position: fixed;
      top: 0;
      bottom: 0;
      right: 0;
      transform: translateX(100%);
      box-shadow: -4px 0 20px rgba(0, 0, 0, 0.1);
      width: 280px;
    }
    body[dir="ltr"] .sidebar { right: auto; left: 0; transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .menu-toggle { display: block; }
    .chat-messages { padding: 16px 12px; }
    .chat-input-area { padding: 12px 12px 16px; }
  }

  /* Overlay for mobile sidebar */
  .sidebar-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    z-index: 9;
    display: none;
  }
  .sidebar-overlay.show { display: block; }
</style>
</head>
<body>

<!-- ================= AUTH SCREEN ================= -->
<div id="authScreen">
  <div class="bg-orb o1"></div>
  <div class="bg-orb o2"></div>

  <div class="auth-card">
    <div class="auth-logo">
      <div class="icon">🤖</div>
      <h1 id="authTitle">Smart AI</h1>
      <p id="authSubtitle">مساعدك الذكي متعدد المحادثات</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login" id="tabLogin">تسجيل الدخول</button>
      <button class="auth-tab" data-tab="signup" id="tabSignup">حساب جديد</button>
    </div>

    <div class="auth-error" id="authError"></div>

    <form id="authForm">
      <div class="form-field">
        <label id="emailLabel">البريد الإلكتروني</label>
        <input type="email" id="email" required autocomplete="email" />
      </div>
      <div class="form-field">
        <label id="passwordLabel">كلمة المرور</label>
        <input type="password" id="password" required autocomplete="current-password" minlength="8" />
      </div>
      <button type="submit" class="btn btn-primary" id="authSubmit">
        <span id="authSubmitText">تسجيل الدخول</span>
      </button>
    </form>

    <div class="divider">أو</div>

    <button class="btn btn-google" id="googleBtn">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      <span id="googleBtnText">المتابعة باستخدام Google</span>
    </button>
  </div>
</div>

<!-- ================= APP SCREEN ================= -->
<div id="appScreen">
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo-mini">🤖</div>
      <div class="title">Smart AI</div>
    </div>

    <button class="new-chat-btn" id="newChatBtn">
      <span>+</span>
      <span id="newChatText">محادثة جديدة</span>
    </button>

    <div class="conv-list" id="convList"></div>

    <div class="sidebar-footer">
      <div class="user-avatar" id="userAvatar">U</div>
      <div class="user-info">
        <div class="user-email" id="userEmail">-</div>
      </div>
      <button class="logout-btn" id="logoutBtn" title="تسجيل الخروج">🚪</button>
    </div>
  </aside>

  <!-- Chat -->
  <div class="chat-area">
    <div class="chat-header">
      <button class="menu-toggle" id="menuToggle">☰</button>
      <div class="chat-title" id="chatTitle">Smart AI</div>
      <button class="icon-btn" id="themeToggle">🌙</button>
      <button class="icon-btn" id="langToggle">EN</button>
    </div>

    <div class="chat-messages" id="chatMessages"></div>

    <div class="chat-input-area">
      <div class="chat-input-wrap">
        <textarea id="msgInput" rows="1" placeholder="اكتب رسالتك..."></textarea>
        <button class="send-btn" id="sendBtn">➤</button>
      </div>
    </div>
  </div>
</div>

<!-- Rename Modal -->
<div class="modal-overlay" id="renameModal">
  <div class="modal">
    <h3 id="renameTitle">إعادة تسمية المحادثة</h3>
    <div class="form-field">
      <input type="text" id="renameInput" />
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="renameCancel">إلغاء</button>
      <button class="btn btn-primary" id="renameSave">حفظ</button>
    </div>
  </div>
</div>

<script>
// ================= SUPABASE CLIENT =================
const SUPABASE_URL = 'YOUR_SUPABASE_URL';
const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

// Initialize Supabase client
let supabaseClient = null;
if (SUPABASE_URL && SUPABASE_ANON_KEY && SUPABASE_URL !== 'YOUR_SUPABASE_URL') {
  supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

// ================= STATE =================
let currentUser = null;
let conversations = [];
let currentConversationId = null;
let currentLang = 'ar';
let isSending = false;
let authMode = 'login';

// ================= TRANSLATIONS =================
const T = {
  ar: {
    authTitle: 'Smart AI',
    authSubtitle: 'مساعدك الذكي متعدد المحادثات',
    tabLogin: 'تسجيل الدخول',
    tabSignup: 'حساب جديد',
    emailLabel: 'البريد الإلكتروني',
    passwordLabel: 'كلمة المرور',
    submitLogin: 'تسجيل الدخول',
    submitSignup: 'إنشاء حساب',
    googleBtn: 'المتابعة باستخدام Google',
    newChat: 'محادثة جديدة',
    chatTitle: 'Smart AI',
    msgPlaceholder: 'اكتب رسالتك...',
    emptyTitle: 'كيف أساعدك اليوم؟',
    emptyText: 'ابدأ محادثة جديدة أو اختر من محادثاتك السابقة.',
    renameTitle: 'إعادة تسمية المحادثة',
    renameCancel: 'إلغاء',
    renameSave: 'حفظ',
    deleteTitle: 'حذف المحادثة',
    deleteText: 'هل أنت متأكد؟ لا يمكن التراجع.',
    deleteCancel: 'إلغاء',
    deleteConfirm: 'حذف',
    errorEmail: 'البريد الإلكتروني أو كلمة المرور غير صحيحة.',
    errorGeneric: 'حدث خطأ. حاول لاحقاً.',
    errorPassword: 'كلمة المرور يجب أن تكون 8 أحرف على الأقل.',
    errorExists: 'هذا البريد مستخدم بالفعل.',
    loading: 'جاري...',
    you: 'أنت',
    ai: 'Smart AI',
  },
  en: {
    authTitle: 'Smart AI',
    authSubtitle: 'Your multi-conversation AI assistant',
    tabLogin: 'Login',
    tabSignup: 'Sign Up',
    emailLabel: 'Email',
    passwordLabel: 'Password',
    submitLogin: 'Login',
    submitSignup: 'Create Account',
    googleBtn: 'Continue with Google',
    newChat: 'New Chat',
    chatTitle: 'Smart AI',
    msgPlaceholder: 'Type your message...',
    emptyTitle: 'How can I help you today?',
    emptyText: 'Start a new chat or pick one from your history.',
    renameTitle: 'Rename Chat',
    renameCancel: 'Cancel',
    renameSave: 'Save',
    deleteTitle: 'Delete Chat',
    deleteText: 'Are you sure? This cannot be undone.',
    deleteCancel: 'Cancel',
    deleteConfirm: 'Delete',
    errorEmail: 'Invalid email or password.',
    errorGeneric: 'Something went wrong. Try again.',
    errorPassword: 'Password must be at least 8 characters.',
    errorExists: 'This email is already in use.',
    loading: 'Loading...',
    you: 'You',
    ai: 'Smart AI',
  }
};

function t(key) { return (T[currentLang] && T[currentLang][key]) || key; }

// ================= LANGUAGE =================
function applyLang(lang) {
  currentLang = lang;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

  document.getElementById('authTitle').textContent = t('authTitle');
  document.getElementById('authSubtitle').textContent = t('authSubtitle');
  document.getElementById('tabLogin').textContent = t('tabLogin');
  document.getElementById('tabSignup').textContent = t('tabSignup');
  document.getElementById('emailLabel').textContent = t('emailLabel');
  document.getElementById('passwordLabel').textContent = t('passwordLabel');
  document.getElementById('authSubmitText').textContent = authMode === 'login' ? t('submitLogin') : t('submitSignup');
  document.getElementById('googleBtnText').textContent = t('googleBtn');
  document.getElementById('newChatText').textContent = t('newChat');
  document.getElementById('msgInput').placeholder = t('msgPlaceholder');
  document.getElementById('renameTitle').textContent = t('renameTitle');
  document.getElementById('renameCancel').textContent = t('renameCancel');
  document.getElementById('renameSave').textContent = t('renameSave');
  document.getElementById('langToggle').textContent = lang === 'ar' ? 'EN' : 'AR';

  if (currentConversationId) {
    const c = conversations.find(x => x.id === currentConversationId);
    if (c) document.getElementById('chatTitle').textContent = c.title;
  } else {
    document.getElementById('chatTitle').textContent = t('chatTitle');
  }

  renderMessages();
}

document.getElementById('langToggle').addEventListener('click', () => {
  applyLang(currentLang === 'ar' ? 'en' : 'ar');
});

// ================= THEME =================
const themeToggle = document.getElementById('themeToggle');
if (localStorage.getItem('theme') === 'dark') {
  document.body.classList.add('dark');
  themeToggle.textContent = '☀️';
}
themeToggle.addEventListener('click', () => {
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  themeToggle.textContent = isDark ? '☀️' : '🌙';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
});

// ================= AUTH UI =================
document.querySelectorAll('.auth-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    authMode = tab.dataset.tab;
    document.getElementById('authSubmitText').textContent = authMode === 'login' ? t('submitLogin') : t('submitSignup');
    document.getElementById('authError').classList.remove('show');
  });
});

function showAuthError(msg) {
  const el = document.getElementById('authError');
  el.textContent = msg;
  el.classList.add('show');
}

document.getElementById('authForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const submitBtn = document.getElementById('authSubmit');

  document.getElementById('authError').classList.remove('show');

  if (authMode === 'signup' && password.length < 8) {
    showAuthError(t('errorPassword'));
    return;
  }

  submitBtn.disabled = true;
  const originalText = document.getElementById('authSubmitText').textContent;
  document.getElementById('authSubmitText').textContent = t('loading');

  try {
    const url = authMode === 'login' ? '/api/auth/login' : '/api/auth/signup';
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || t('errorGeneric'));

    currentUser = data.user;
    await enterApp();
  } catch (err) {
    let msg = err.message;
    if (msg.toLowerCase().includes('invalid')) msg = t('errorEmail');
    else if (msg.toLowerCase().includes('already')) msg = t('errorExists');
    showAuthError(msg);
  } finally {
    submitBtn.disabled = false;
    document.getElementById('authSubmitText').textContent = originalText;
  }
});

// ================= GOOGLE AUTH =================
document.getElementById('googleBtn').addEventListener('click', async () => {
  if (!supabaseClient) {
    showAuthError('Supabase client not configured. Please add SUPABASE_URL and SUPABASE_ANON_KEY.');
    return;
  }

  try {
    const { data, error } = await supabaseClient.auth.signInWithOAuth({
      provider: 'google',
      options: {
        redirectTo: window.location.origin + '/auth/callback',
        queryParams: {
          access_type: 'offline',
          prompt: 'consent',
        },
      },
    });

    if (error) throw error;
  } catch (err) {
    showAuthError(err.message || t('errorGeneric'));
  }
});

// ================= APP =================
async function enterApp() {
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('appScreen').classList.add('show');

  document.getElementById('userEmail').textContent = currentUser.email;
  document.getElementById('userAvatar').textContent = (currentUser.email[0] || 'U').toUpperCase();

  await loadConversations();
  renderMessages();
}

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await fetch('/api/auth/logout', { method: 'POST' });
  currentUser = null;
  conversations = [];
  currentConversationId = null;
  document.getElementById('appScreen').classList.remove('show');
  document.getElementById('authScreen').style.display = 'flex';
  document.getElementById('email').value = '';
  document.getElementById('password').value = '';
});

// ================= CONVERSATIONS =================
async function loadConversations() {
  try {
    const res = await fetch('/api/conversations');
    const data = await res.json();
    conversations = data.conversations || [];
    renderConversations();
  } catch (err) {
    console.error(err);
  }
}

function renderConversations() {
  const list = document.getElementById('convList');
  list.innerHTML = '';

  if (conversations.length === 0) {
    list.innerHTML = `<div style="text-align:center;padding:20px;color:var(--muted);font-size:0.82rem;">${currentLang === 'ar' ? 'لا توجد محادثات بعد' : 'No conversations yet'}</div>`;
    return;
  }

  conversations.forEach(c => {
    const item = document.createElement('div');
    item.className = 'conv-item' + (c.id === currentConversationId ? ' active' : '');
    item.innerHTML = `
      <span class="icon">💬</span>
      <span class="text">${escapeHtml(c.title)}</span>
      <button class="menu-btn" data-id="${c.id}">⋮</button>
    `;
    item.addEventListener('click', (e) => {
      if (e.target.classList.contains('menu-btn')) return;
      selectConversation(c.id);
    });
    item.querySelector('.menu-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      showConvMenu(c, e.target);
    });
    list.appendChild(item);
  });
}

function showConvMenu(conv, anchor) {
  const existing = document.querySelector('.conv-context-menu');
  if (existing) existing.remove();

  const menu = document.createElement('div');
  menu.className = 'conv-context-menu';
  menu.style.cssText = `
    position: fixed;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    z-index: 2000;
    min-width: 160px;
  `;
  const rect = anchor.getBoundingClientRect();
  menu.style.top = (rect.bottom + 4) + 'px';
  menu.style.left = Math.max(10, rect.right - 160) + 'px';

  menu.innerHTML = `
    <div class="menu-item" data-action="rename" style="padding:8px 12px;border-radius:6px;cursor:pointer;font-size:0.88rem;">✏️ ${currentLang === 'ar' ? 'إعادة تسمية' : 'Rename'}</div>
    <div class="menu-item" data-action="delete" style="padding:8px 12px;border-radius:6px;cursor:pointer;font-size:0.88rem;color:#E84393;">🗑️ ${currentLang === 'ar' ? 'حذف' : 'Delete'}</div>
  `;

  menu.querySelectorAll('.menu-item').forEach(item => {
    item.addEventListener('mouseenter', () => item.style.background = 'var(--bg-2)');
    item.addEventListener('mouseleave', () => item.style.background = 'transparent');
    item.addEventListener('click', () => {
      const action = item.dataset.action;
      menu.remove();
      if (action === 'rename') openRenameModal(conv);
      else if (action === 'delete') openDeleteModal(conv);
    });
  });

  document.body.appendChild(menu);
  setTimeout(() => {
    document.addEventListener('click', function closeMenu() {
      menu.remove();
      document.removeEventListener('click', closeMenu);
    });
  }, 0);
}

async function selectConversation(id) {
  currentConversationId = id;
  const conv = conversations.find(c => c.id === id);
  if (conv) document.getElementById('chatTitle').textContent = conv.title;
  renderConversations();
  closeSidebar();

  const el = document.getElementById('chatMessages');
  el.innerHTML = '<div style="text-align:center;padding:20px;color:var(--muted);">' + t('loading') + '</div>';

  try {
    const res = await fetch(`/api/conversations/${id}/messages`);
    const data = await res.json();
    currentMessages = data.messages || [];
    renderMessages();
  } catch (err) {
    console.error(err);
  }
}

document.getElementById('newChatBtn').addEventListener('click', async () => {
  try {
    const res = await fetch('/api/conversations', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: 'New Chat' }),
    });
    const data = await res.json();
    if (data.conversation) {
      conversations.unshift(data.conversation);
      currentConversationId = data.conversation.id;
      currentMessages = [];
      document.getElementById('chatTitle').textContent = data.conversation.title;
      renderConversations();
      renderMessages();
      closeSidebar();
      document.getElementById('msgInput').focus();
    }
  } catch (err) {
    console.error(err);
  }
});

// ================= MESSAGES =================
let currentMessages = [];

function renderMessages() {
  const el = document.getElementById('chatMessages');
  el.innerHTML = '';

  if (!currentConversationId || currentMessages.length === 0) {
    el.innerHTML = `
      <div class="empty-state">
        <div class="icon">🤖</div>
        <h2>${t('emptyTitle')}</h2>
        <p>${t('emptyText')}</p>
      </div>
    `;
    return;
  }

  currentMessages.forEach(m => {
    const div = document.createElement('div');
    div.className = 'msg ' + (m.role === 'user' ? 'user' : 'ai');
    div.innerHTML = `
      <div class="msg-avatar">${m.role === 'user' ? '👤' : '🤖'}</div>
      <div class="msg-body">${m.role === 'user' ? escapeHtml(m.content) : marked.parse(m.content)}</div>
    `;
    el.appendChild(div);
  });

  el.scrollTop = el.scrollHeight;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ================= SEND MESSAGE =================
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');

msgInput.addEventListener('input', () => {
  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(msgInput.scrollHeight, 140) + 'px';
});

msgInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

sendBtn.addEventListener('click', sendMessage);

async function sendMessage() {
  const content = msgInput.value.trim();
  if (!content || isSending) return;

  if (!currentConversationId) {
    await document.getElementById('newChatBtn').click();
  }

  isSending = true;
  sendBtn.disabled = true;
  msgInput.value = '';
  msgInput.style.height = 'auto';

  // Optimistic UI
  currentMessages.push({ role: 'user', content });
  renderMessages();

  // Typing indicator
  const el = document.getElementById('chatMessages');
  const typing = document.createElement('div');
  typing.className = 'msg ai';
  typing.id = 'typingIndicator';
  typing.innerHTML = `
    <div class="msg-avatar">🤖</div>
    <div class="msg-body"><div class="typing"><span></span><span></span><span></span></div></div>
  `;
  el.appendChild(typing);
  el.scrollTop = el.scrollHeight;

  try {
    const res = await fetch(`/api/conversations/${currentConversationId}/messages`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Error');

    document.getElementById('typingIndicator')?.remove();

    currentMessages.push({ role: 'assistant', content: data.aiMessage.content });
    renderMessages();

    // Update conversation title if changed
    if (data.conversationTitle) {
      const c = conversations.find(x => x.id === currentConversationId);
      if (c) {
        c.title = data.conversationTitle;
        document.getElementById('chatTitle').textContent = c.title;
        renderConversations();
      }
    }

    // Move conv to top
    const idx = conversations.findIndex(c => c.id === currentConversationId);
    if (idx > 0) {
      const [c] = conversations.splice(idx, 1);
      conversations.unshift(c);
      renderConversations();
    }
  } catch (err) {
    document.getElementById('typingIndicator')?.remove();
    currentMessages.push({ role: 'assistant', content: '⚠️ ' + t('errorGeneric') });
    renderMessages();
  } finally {
    isSending = false;
    sendBtn.disabled = false;
    msgInput.focus();
  }
}

// ================= RENAME MODAL =================
let renamingConv = null;

function openRenameModal(conv) {
  renamingConv = conv;
  document.getElementById('renameInput').value = conv.title;
  document.getElementById('renameModal').classList.add('show');
  setTimeout(() => document.getElementById('renameInput').focus(), 100);
}

document.getElementById('renameCancel').addEventListener('click', () => {
  document.getElementById('renameModal').classList.remove('show');
});

document.getElementById('renameSave').addEventListener('click', async () => {
  const newTitle = document.getElementById('renameInput').value.trim();
  if (!newTitle || !renamingConv) return;

  try {
    const res = await fetch(`/api/conversations/${renamingConv.id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: newTitle }),
    });
    const data = await res.json();
    if (data.conversation) {
      renamingConv.title = data.conversation.title;
      if (renamingConv.id === currentConversationId) {
        document.getElementById('chatTitle').textContent = data.conversation.title;
      }
      renderConversations();
    }
  } catch (err) {
    console.error(err);
  }
  document.getElementById('renameModal').classList.remove('show');
});

// ================= DELETE =================
function openDeleteModal(conv) {
  if (!confirm(t('deleteText'))) return;

  fetch(`/api/conversations/${conv.id}`, { method: 'DELETE' })
    .then(res => res.json())
    .then(() => {
      conversations = conversations.filter(c => c.id !== conv.id);
      if (currentConversationId === conv.id) {
        currentConversationId = null;
        currentMessages = [];
        document.getElementById('chatTitle').textContent = t('chatTitle');
        renderMessages();
      }
      renderConversations();
    })
    .catch(err => console.error(err));
}

// ================= SIDEBAR (mobile) =================
const sidebar = document.getElementById('sidebar');
const sidebarOverlay = document.getElementById('sidebarOverlay');

document.getElementById('menuToggle').addEventListener('click', () => {
  sidebar.classList.add('open');
  sidebarOverlay.classList.add('show');
});

function closeSidebar() {
  sidebar.classList.remove('open');
  sidebarOverlay.classList.remove('show');
}

sidebarOverlay.addEventListener('click', closeSidebar);

// ================= INIT =================
(async function init() {
  applyLang('ar');

  // Check if already logged in
  try {
    const res = await fetch('/api/auth/me');
    if (res.ok) {
      const data = await res.json();
      currentUser = data.user;
      await enterApp();
    }
  } catch (err) {
    // Not logged in
  }
})();
</script>
</body>
