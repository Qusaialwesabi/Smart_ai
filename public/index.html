<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: 'Cairo', sans-serif; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: #0f172a; }
  ::-webkit-scrollbar-thumb { background: #4c1d95; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #6d28d9; }

  .ai-gradient {
    background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
  }
  .glow {
    box-shadow: 0 0 25px rgba(168, 85, 247, 0.4);
  }
  .glow-sm {
    box-shadow: 0 0 15px rgba(168, 85, 247, 0.25);
  }

  /* ===== SIDEBAR POSITIONING (RTL/LTR FIX) ===== */
  #sidebar {
    right: 0;
    transform: translateX(100%);
    transition: transform 0.3s ease;
  }
  #sidebar.open {
    transform: translateX(0);
  }
  body[dir="ltr"] #sidebar {
    right: auto;
    left: 0;
    border-left: none;
    border-right: 1px solid #1e293b;
    transform: translateX(-100%);
  }
  body[dir="ltr"] #sidebar.open {
    transform: translateX(0);
  }

  /* Desktop: always visible */
  @media (min-width: 768px) {
    #sidebar,
    body[dir="ltr"] #sidebar {
      transform: translateX(0) !important;
      position: relative !important;
    }
  }

  /* ===== MARKDOWN INSIDE MESSAGES ===== */
  .msg-body h1, .msg-body h2, .msg-body h3 {
    margin: 12px 0 6px; font-weight: 700; color: #a855f7;
  }
  .msg-body h1 { font-size: 1.2rem; }
  .msg-body h2 { font-size: 1.1rem; }
  .msg-body h3 { font-size: 1rem; }
  .msg-body p { margin-bottom: 10px; }
  .msg-body ul, .msg-body ol { margin: 6px 0 12px 20px; }
  body[dir="rtl"] .msg-body ul, body[dir="rtl"] .msg-body ol { margin: 6px 20px 12px 0; }
  .msg-body li { margin-bottom: 4px; }
  .msg-body strong { color: #c084fc; font-weight: 700; }
  .msg-body a { color: #a855f7; text-decoration: underline; }
  .msg-body code {
    background: #1e293b;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: 'Courier New', Consolas, monospace;
    font-size: 0.88em;
    color: #e9d5ff;
    direction: ltr;
    unicode-bidi: embed;
  }

  /* Code blocks - fixed for long lines */
  .msg-body pre {
    background: #0b1220;
    padding: 14px;
    border-radius: 10px;
    overflow-x: auto;
    overflow-y: auto;
    margin: 10px 0;
    max-width: 100%;
    font-size: 0.82rem;
    line-height: 1.6;
    white-space: pre;
    direction: ltr;
    text-align: left;
    border: 1px solid #334155;
    -webkit-overflow-scrolling: touch;
  }
  .msg-body pre code {
    background: none;
    padding: 0;
    color: #e2e8f0;
    font-size: 0.82rem;
    white-space: pre;
    display: block;
    font-family: 'Courier New', Consolas, Monaco, monospace;
  }
  .msg-body hr { border: none; border-top: 1px solid #334155; margin: 14px 0; }
  .msg-body blockquote {
    border-left: 3px solid #a855f7;
    padding-left: 12px;
    margin: 10px 0;
    color: #94a3b8;
    font-style: italic;
  }
  body[dir="rtl"] .msg-body blockquote {
    border-left: none;
    border-right: 3px solid #a855f7;
    padding-left: 0;
    padding-right: 12px;
  }
  .msg-body table {
    border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 0.85rem;
    display: block; overflow-x: auto;
  }
  .msg-body th, .msg-body td {
    border: 1px solid #334155; padding: 8px 10px; text-align: start;
  }
  .msg-body th { background: #1e293b; font-weight: 700; }

  /* ===== TYPING INDICATOR ===== */
  .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing span {
    width: 8px; height: 8px; border-radius: 50%;
    background: #a855f7;
    animation: typing 1.4s infinite;
    opacity: 0.4;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing {
    0%, 60%, 100% { opacity: 0.4; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-4px); }
  }

  /* ===== FADE IN ===== */
  .fade-in { animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  /* ===== SIDEBAR OVERLAY ===== */
  .sidebar-overlay {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.6);
    z-index: 40;
    display: none;
  }
  .sidebar-overlay.show { display: block; }

  /* Hide scrollbar utility */
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
</style>
</head>

<script>
// ==================== CONFIG ====================
const SUPABASE_URL =https://sjnwberjjeweglpbjigr.supabase.co
const SUPABASE_ANON_KEY =sb_publishable_mkRfQmalI1OuAIhm6RD3ng_e43iaZc0

let supabaseClient = null;
if (SUPABASE_URL && SUPABASE_ANON_KEY && SUPABASE_URL !== 'YOUR_SUPABASE_URL') {
  supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

// ==================== STATE ====================
let currentUser = null;
let conversations = [];
let currentConversationId = null;
let currentLang = 'ar';
let isSending = false;
let authMode = 'login';
let currentMessages = [];
let renamingConv = null;

// ==================== TRANSLATIONS ====================
const T = {
  ar: {
    authSubtitle: 'مساعدك الذكي متعدد المحادثات',
    tabLogin: 'تسجيل الدخول',
    tabSignup: 'حساب جديد',
    emailLabel: 'البريد الإلكتروني',
    passwordLabel: 'كلمة المرور',
    submitLogin: 'تسجيل الدخول',
    submitSignup: 'إنشاء حساب',
    googleBtn: 'المتابعة باستخدام Google',
    divider: 'أو',
    newChat: 'محادثة جديدة',
    chatTitle: 'Smart AI',
    msgPlaceholder: 'اكتب رسالتك...',
    emptyTitle: 'كيف أساعدك اليوم؟',
    emptyText: 'ابدأ محادثة جديدة أو اختر من محادثاتك السابقة.',
    renameTitle: 'إعادة تسمية المحادثة',
    renameCancel: 'إلغاء',
    renameSave: 'حفظ',
    renameMenu: 'إعادة تسمية',
    deleteMenu: 'حذف',
    deleteText: 'هل أنت متأكد؟ لا يمكن التراجع.',
    noConvs: 'لا توجد محادثات بعد',
    errorEmail: 'البريد الإلكتروني أو كلمة المرور غير صحيحة.',
    errorGeneric: 'حدث خطأ. حاول لاحقاً.',
    errorPassword: 'كلمة المرور يجب أن تكون 8 أحرف على الأقل.',
    errorExists: 'هذا البريد مستخدم بالفعل.',
    loading: 'جاري...',
  },
  en: {
    authSubtitle: 'Your multi-conversation AI assistant',
    tabLogin: 'Login',
    tabSignup: 'Sign Up',
    emailLabel: 'Email',
    passwordLabel: 'Password',
    submitLogin: 'Login',
    submitSignup: 'Create Account',
    googleBtn: 'Continue with Google',
    divider: 'or',
    newChat: 'New Chat',
    chatTitle: 'Smart AI',
    msgPlaceholder: 'Type your message...',
    emptyTitle: 'How can I help you today?',
    emptyText: 'Start a new chat or pick one from your history.',
    renameTitle: 'Rename Chat',
    renameCancel: 'Cancel',
    renameSave: 'Save',
    renameMenu: 'Rename',
    deleteMenu: 'Delete',
    deleteText: 'Are you sure? This cannot be undone.',
    noConvs: 'No conversations yet',
    errorEmail: 'Invalid email or password.',
    errorGeneric: 'Something went wrong. Try again.',
    errorPassword: 'Password must be at least 8 characters.',
    errorExists: 'This email is already in use.',
    loading: 'Loading...',
  }
};

function t(key) { return (T[currentLang] && T[currentLang][key]) || key; }

// ==================== LANGUAGE (Translation ONLY - direction stays RTL) ====================
function applyLang(lang) {
  currentLang = lang;

  // Translate texts
  document.getElementById('authSubtitle').textContent = t('authSubtitle');
  document.getElementById('tabLoginText').textContent = t('tabLogin');
  document.getElementById('tabSignupText').textContent = t('tabSignup');
  document.getElementById('emailLabel').textContent = t('emailLabel');
  document.getElementById('passwordLabel').textContent = t('passwordLabel');
  document.getElementById('authSubmitText').textContent = authMode === 'login' ? t('submitLogin') : t('submitSignup');
  document.getElementById('googleBtnText').textContent = t('googleBtn');
  document.getElementById('dividerText').textContent = t('divider');
  document.getElementById('newChatText').textContent = t('newChat');
  document.getElementById('msgInput').placeholder = t('msgPlaceholder');
  document.getElementById('renameTitle').textContent = t('renameTitle');
  document.getElementById('renameCancel').textContent = t('renameCancel');
  document.getElementById('renameSave').textContent = t('renameSave');

  if (currentConversationId) {
    const c = conversations.find(x => x.id === currentConversationId);
    if (c) document.getElementById('chatTitle').textContent = c.title;
  } else {
    document.getElementById('chatTitle').textContent = t('chatTitle');
  }

  renderConversations();
  renderMessages();
}

// Language toggle - translation only
document.getElementById('langToggle').addEventListener('click', () => {
  applyLang(currentLang === 'ar' ? 'en' : 'ar');
});

// ==================== AUTH UI ====================
document.querySelectorAll('.auth-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.auth-tab').forEach(el => {
      el.classList.remove('bg-slate-900', 'text-white', 'shadow-md');
      el.classList.add('text-slate-400');
    });
    tab.classList.remove('text-slate-400');
    tab.classList.add('bg-slate-900', 'text-white', 'shadow-md');
    authMode = tab.dataset.tab;
    document.getElementById('authSubmitText').textContent = authMode === 'login' ? t('submitLogin') : t('submitSignup');
    hideAuthError();
  });
});

function showAuthError(msg) {
  const el = document.getElementById('authError');
  el.textContent = msg;
  el.classList.remove('hidden');
}
function hideAuthError() {
  document.getElementById('authError').classList.add('hidden');
}

document.getElementById('authForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const submitBtn = document.getElementById('authSubmit');

  hideAuthError();

  if (authMode === 'signup' && password.length < 8) {
    showAuthError(t('errorPassword'));
    return;
  }

  submitBtn.disabled = true;
  const orig = document.getElementById('authSubmitText').textContent;
  document.getElementById('authSubmitText').textContent = t('loading');

  try {
    const url = authMode === 'login' ? '/api/auth/login' : '/api/auth/signup';
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || t('errorGeneric'));

    currentUser = data.user;
    await enterApp();
  } catch (err) {
    let msg = err.message;
    if (msg.toLowerCase().includes('invalid')) msg = t('errorEmail');
    else if (msg.toLowerCase().includes('already')) msg = t('errorExists');
    showAuthError(msg);
  } finally {
    submitBtn.disabled = false;
    document.getElementById('authSubmitText').textContent = orig;
  }
});

// ==================== GOOGLE AUTH ====================
document.getElementById('googleBtn').addEventListener('click', async () => {
  if (!supabaseClient) {
    showAuthError('Supabase client not configured.');
    return;
  }
  try {
    const { error } = await supabaseClient.auth.signInWithOAuth({
      provider: 'google',
      options: {
        redirectTo: window.location.origin + '/auth/callback',
        queryParams: { access_type: 'offline', prompt: 'consent' },
      },
    });
    if (error) throw error;
  } catch (err) {
    showAuthError(err.message || t('errorGeneric'));
  }
});

// ==================== ENTER APP ====================
async function enterApp() {
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('appScreen').classList.remove('hidden');
  document.getElementById('appScreen').classList.add('flex');

  document.getElementById('userEmail').textContent = currentUser.email;
  document.getElementById('userAvatar').textContent = (currentUser.email[0] || 'U').toUpperCase();

  await loadConversations();
  renderMessages();
}

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await fetch('/api/auth/logout', { method: 'POST' });
  if (supabaseClient) await supabaseClient.auth.signOut();
  currentUser = null;
  conversations = [];
  currentConversationId = null;
  currentMessages = [];
  document.getElementById('appScreen').classList.add('hidden');
  document.getElementById('appScreen').classList.remove('flex');
  document.getElementById('authScreen').classList.remove('hidden');
  document.getElementById('email').value = '';
  document.getElementById('password').value = '';
});

// ==================== CONVERSATIONS ====================
async function loadConversations() {
  try {
    const res = await fetch('/api/conversations');
    const data = await res.json();
    conversations = data.conversations || [];
    renderConversations();
  } catch (err) {
    console.error(err);
  }
}

function renderConversations() {
  const list = document.getElementById('convList');
  list.innerHTML = '';

  if (conversations.length === 0) {
    list.innerHTML = `<div class="text-center py-6 text-slate-500 text-xs">${t('noConvs')}</div>`;
    return;
  }

  conversations.forEach(c => {
    const item = document.createElement('div');
    const isActive = c.id === currentConversationId;
    item.className = `group flex items-center gap-2 px-3 py-2.5 rounded-lg mb-1 cursor-pointer transition ${
      isActive
        ? 'bg-purple-900/30 border border-purple-700/40'
        : 'hover:bg-slate-800/60 border border-transparent'
    }`;
    item.innerHTML = `
      <i class="fa-solid fa-comment-dots text-xs ${isActive ? 'text-purple-400' : 'text-slate-500'}"></i>
      <span class="flex-1 text-sm ${isActive ? 'text-white font-semibold' : 'text-slate-300'} truncate">${escapeHtml(c.title)}</span>
      <button class="menu-btn opacity-0 group-hover:opacity-100 text-slate-400 hover:text-white px-1 transition" data-id="${c.id}">
        <i class="fa-solid fa-ellipsis-vertical text-xs"></i>
      </button>
    `;
    item.addEventListener('click', (e) => {
      if (e.target.closest('.menu-btn')) return;
      selectConversation(c.id);
    });
    item.querySelector('.menu-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      showConvMenu(c, e.target);
    });
    list.appendChild(item);
  });
}

function showConvMenu(conv, anchor) {
  const existing = document.querySelector('.conv-context-menu');
  if (existing) existing.remove();

  const menu = document.createElement('div');
  menu.className = 'conv-context-menu';
  menu.style.cssText = `
    position: fixed;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 6px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    z-index: 2000;
    min-width: 150px;
  `;
  const rect = anchor.getBoundingClientRect();
  menu.style.top = (rect.bottom + 4) + 'px';
  menu.style.left = Math.max(10, rect.right - 150) + 'px';

  menu.innerHTML = `
    <div class="menu-item flex items-center gap-2" data-action="rename"
      style="padding:8px 12px;border-radius:6px;cursor:pointer;font-size:0.85rem;color:#e2e8f0;">
      <i class="fa-solid fa-pen text-xs"></i> ${t('renameMenu')}
    </div>
    <div class="menu-item flex items-center gap-2" data-action="delete"
      style="padding:8px 12px;border-radius:6px;cursor:pointer;font-size:0.85rem;color:#f87171;">
      <i class="fa-solid fa-trash text-xs"></i> ${t('deleteMenu')}
    </div>
  `;

  menu.querySelectorAll('.menu-item').forEach(item => {
    item.addEventListener('mouseenter', () => item.style.background = '#334155');
    item.addEventListener('mouseleave', () => item.style.background = 'transparent');
    item.addEventListener('click', () => {
      const action = item.dataset.action;
      menu.remove();
      if (action === 'rename') openRenameModal(conv);
      else if (action === 'delete') deleteConversation(conv);
    });
  });

  document.body.appendChild(menu);
  setTimeout(() => {
    document.addEventListener('click', function closeMenu(ev) {
      if (!menu.contains(ev.target)) {
        menu.remove();
        document.removeEventListener('click', closeMenu);
      }
    });
  }, 0);
}

async function selectConversation(id) {
  currentConversationId = id;
  const conv = conversations.find(c => c.id === id);
  if (conv) document.getElementById('chatTitle').textContent = conv.title;
  renderConversations();
  closeSidebar();

  const el = document.getElementById('chatMessages');
  el.innerHTML = '<div class="text-center py-8 text-slate-500 text-sm"><i class="fa-solid fa-spinner fa-spin"></i></div>';

  try {
    const res = await fetch(`/api/conversations/${id}/messages`);
    const data = await res.json();
    currentMessages = data.messages || [];
    renderMessages();
  } catch (err) {
    console.error(err);
  }
}

document.getElementById('newChatBtn').addEventListener('click', async () => {
  try {
    const res = await fetch('/api/conversations', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: 'New Chat' }),
    });
    const data = await res.json();
    if (data.conversation) {
      conversations.unshift(data.conversation);
      currentConversationId = data.conversation.id;
      currentMessages = [];
      document.getElementById('chatTitle').textContent = data.conversation.title;
      renderConversations();
      renderMessages();
      closeSidebar();
      setTimeout(() => document.getElementById('msgInput').focus(), 100);
    }
  } catch (err) {
    console.error(err);
  }
});

// ==================== MESSAGES ====================
function renderMessages() {
  const el = document.getElementById('chatMessages');
  el.innerHTML = '';

  if (!currentConversationId || currentMessages.length === 0) {
    el.innerHTML = `
      <div class="flex flex-col items-center justify-center h-full text-center px-6 py-12">
        <div class="w-20 h-20 rounded-2xl ai-gradient glow flex items-center justify-center mb-5">
          <i class="fa-solid fa-robot text-white text-3xl"></i>
        </div>
        <h2 class="text-2xl font-black text-white mb-2">${t('emptyTitle')}</h2>
        <p class="text-slate-400 text-sm max-w-sm">${t('emptyText')}</p>
      </div>
    `;
    return;
  }

  currentMessages.forEach(m => {
    const div = document.createElement('div');
    div.className = 'flex gap-3 fade-in';

    if (m.role === 'user') {
      div.innerHTML = `
        <div class="w-9 h-9 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300 shrink-0">
          <i class="fa-solid fa-user text-sm"></i>
        </div>
        <div class="flex-1 min-w-0 bg-slate-900 border border-slate-800 rounded-2xl px-4 py-3">
          <div class="msg-body text-slate-200 text-sm leading-relaxed break-words">${escapeHtml(m.content)}</div>
        </div>
      `;
    } else {
      div.innerHTML = `
        <div class="w-9 h-9 rounded-xl ai-gradient flex items-center justify-center text-white shrink-0 glow-sm">
          <i class="fa-solid fa-robot text-sm"></i>
        </div>
        <div class="flex-1 min-w-0 bg-slate-900/80 border border-slate-800 rounded-2xl px-4 py-3">
          <div class="msg-body text-slate-200 text-sm leading-relaxed break-words">${marked.parse(m.content)}</div>
        </div>
      `;
    }
    el.appendChild(div);
  });

  el.scrollTop = el.scrollHeight;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ==================== SEND MESSAGE ====================
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');

msgInput.addEventListener('input', () => {
  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(msgInput.scrollHeight, 144) + 'px';
});

msgInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

sendBtn.addEventListener('click', sendMessage);

async function sendMessage() {
  const content = msgInput.value.trim();
  if (!content || isSending) return;

  if (!currentConversationId) {
    await document.getElementById('newChatBtn').click();
    if (!currentConversationId) return;
  }

  isSending = true;
  sendBtn.disabled = true;
  msgInput.value = '';
  msgInput.style.height = 'auto';

  currentMessages.push({ role: 'user', content });
  renderMessages();

  const el = document.getElementById('chatMessages');
  const typing = document.createElement('div');
  typing.className = 'flex gap-3 fade-in';
  typing.id = 'typingIndicator';
  typing.innerHTML = `
    <div class="w-9 h-9 rounded-xl ai-gradient flex items-center justify-center text-white shrink-0 glow-sm">
      <i class="fa-solid fa-robot text-sm"></i>
    </div>
    <div class="flex-1 bg-slate-900/80 border border-slate-800 rounded-2xl px-4 py-3">
      <div class="typing"><span></span><span></span><span></span></div>
    </div>
  `;
  el.appendChild(typing);
  el.scrollTop = el.scrollHeight;

  try {
    const res = await fetch(`/api/conversations/${currentConversationId}/messages`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Error');

    document.getElementById('typingIndicator')?.remove();
    currentMessages.push({ role: 'assistant', content: data.aiMessage.content });
    renderMessages();

    if (data.conversationTitle) {
      const c = conversations.find(x => x.id === currentConversationId);
      if (c) {
        c.title = data.conversationTitle;
        document.getElementById('chatTitle').textContent = c.title;
        renderConversations();
      }
    }

    const idx = conversations.findIndex(c => c.id === currentConversationId);
    if (idx > 0) {
      const [c] = conversations.splice(idx, 1);
      conversations.unshift(c);
      renderConversations();
    }
  } catch (err) {
    document.getElementById('typingIndicator')?.remove();
    currentMessages.push({ role: 'assistant', content: '⚠️ ' + t('errorGeneric') });
    renderMessages();
  } finally {
    isSending = false;
    sendBtn.disabled = false;
    msgInput.focus();
  }
}

// ==================== RENAME MODAL ====================
function openRenameModal(conv) {
  renamingConv = conv;
  document.getElementById('renameInput').value = conv.title;
  document.getElementById('renameModal').classList.remove('hidden');
  document.getElementById('renameModal').classList.add('flex');
  setTimeout(() => document.getElementById('renameInput').focus(), 100);
}

document.getElementById('renameCancel').addEventListener('click', () => {
  document.getElementById('renameModal').classList.add('hidden');
  document.getElementById('renameModal').classList.remove('flex');
});

document.getElementById('renameSave').addEventListener('click', async () => {
  const newTitle = document.getElementById('renameInput').value.trim();
  if (!newTitle || !renamingConv) return;

  try {
    const res = await fetch(`/api/conversations/${renamingConv.id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: newTitle }),
    });
    const data = await res.json();
    if (data.conversation) {
      renamingConv.title = data.conversation.title;
      if (renamingConv.id === currentConversationId) {
        document.getElementById('chatTitle').textContent = data.conversation.title;
      }
      renderConversations();
    }
  } catch (err) {
    console.error(err);
  }
  document.getElementById('renameModal').classList.add('hidden');
  document.getElementById('renameModal').classList.remove('flex');
});

// ==================== DELETE ====================
function deleteConversation(conv) {
  if (!confirm(t('deleteText'))) return;

  fetch(`/api/conversations/${conv.id}`, { method: 'DELETE' })
    .then(res => res.json())
    .then(() => {
      conversations = conversations.filter(c => c.id !== conv.id);
      if (currentConversationId === conv.id) {
        currentConversationId = null;
        currentMessages = [];
        document.getElementById('chatTitle').textContent = t('chatTitle');
        renderMessages();
      }
      renderConversations();
    })
    .catch(err => console.error(err));
}

// ==================== SIDEBAR ====================
const sidebar = document.getElementById('sidebar');
const sidebarOverlay = document.getElementById('sidebarOverlay');

function openSidebar() {
  sidebar.classList.add('open');
  sidebarOverlay.classList.add('show');
}

function closeSidebar() {
  if (window.innerWidth < 768) {
    sidebar.classList.remove('open');
  }
  sidebarOverlay.classList.remove('show');
}

document.getElementById('menuToggle').addEventListener('click', openSidebar);
document.getElementById('closeSidebarBtn')?.addEventListener('click', closeSidebar);
sidebarOverlay.addEventListener('click', closeSidebar);

// ==================== INIT ====================
(async function init() {
  applyLang('ar');

  // Handle Supabase OAuth callback
  if (supabaseClient && window.location.hash.includes('access_token')) {
    try {
      const { data, error } = await supabaseClient.auth.getSession();
      if (!error && data.session) {
        const res = await fetch('/api/auth/google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            access_token: data.session.access_token,
            refresh_token: data.session.refresh_token,
          }),
        });
        const result = await res.json();
        if (res.ok && result.user) {
          currentUser = result.user;
          window.history.replaceState(null, '', window.location.pathname);
          await enterApp();
          return;
        }
      }
    } catch (err) {
      console.error('Google callback error:', err);
    }
  }

  // Check session
  try {
    const res = await fetch('/api/auth/me');
    if (res.ok) {
      const data = await res.json();
      currentUser = data.user;
      await enterApp();
    }
  } catch (err) {}
})();
</script>
