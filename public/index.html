<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart AI - مساعد الذكاء الاصطناعي</title>
  <!-- خطوط وأيقونات FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- مكتبة Marked لعرض Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-color: #121212;
      --sidebar-bg: #1e1e1e;
      --chat-bg: #181818;
      --input-bg: #2a2a2a;
      --text-color: #e0e0e0;
      --text-muted: #888888;
      --accent-color: #4f46e5;
      --accent-hover: #4338ca;
      --border-color: #333333;
      --danger-color: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      height: 100vh;
      overflow: hidden;
    }

    /* شاشة المصادقة (تسجيل الدخول / إنشاء حساب) */
    #auth-screen {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: var(--bg-color);
    }

    .auth-card {
      background-color: var(--sidebar-bg);
      padding: 2.5rem;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .auth-card h2 {
      margin-bottom: 1.5rem;
      text-align: center;
      color: #fff;
    }

    .auth-input {
      width: 100%;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
    }

    .auth-input:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    .auth-btn {
      width: 100%;
      padding: 0.75rem;
      background-color: var(--accent-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .auth-btn:hover {
      background-color: var(--accent-hover);
    }

    .auth-toggle {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    .auth-toggle span {
      color: var(--accent-color);
      text-decoration: underline;
    }

    /* تطبيق الشات الرئيسي */
    #app-container {
      display: none;
      height: 100vh;
      display: flex;
    }

    /* الشريط الجانبي */
    .sidebar {
      width: 280px;
      background-color: var(--sidebar-bg);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      height: 100%;
      transition: transform 0.3s ease;
      z-index: 100;
    }

    .sidebar-header {
      padding: 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    .new-chat-btn {
      width: 100%;
      padding: 0.75rem;
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 0.95rem;
      transition: background 0.2s;
    }

    .new-chat-btn:hover {
      background-color: var(--input-bg);
    }

    .conversations-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
    }

    .conv-item {
      padding: 0.75rem;
      margin-bottom: 0.25rem;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-color);
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .conv-item:hover {
      background-color: var(--input-bg);
    }

    .conv-item.active {
      background-color: var(--input-bg);
      border-right: 3px solid var(--accent-color);
    }

    .conv-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .conv-actions {
      display: flex;
      gap: 0.5rem;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .conv-item:hover .conv-actions {
      opacity: 1;
    }

    .conv-actions i {
      color: var(--text-muted);
      cursor: pointer;
    }

    .conv-actions i:hover {
      color: var(--danger-color);
    }

    .sidebar-footer {
      padding: 1rem;
      border-top: 1px solid var(--border-color);
    }

    .logout-btn {
      width: 100%;
      padding: 0.5rem;
      background-color: transparent;
      border: none;
      color: var(--danger-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      border-radius: 6px;
    }

    .logout-btn:hover {
      background-color: rgba(239, 68, 68, 0.1);
    }

    /* منطقة الشات الرئيسية */
    .chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      background-color: var(--chat-bg);
      position: relative;
    }

    .chat-header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--chat-bg);
    }

    .chat-header h3 {
      font-size: 1.1rem;
      color: #fff;
    }

    #toggle-sidebar {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
      display: none;
    }

    /* شارة العداد في الهيدر */
    .usage-badge {
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      padding: 0.35rem 0.75rem;
      border-radius: 20px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      color: #38bdf8;
    }

    .usage-badge.low {
      border-color: var(--danger-color);
      color: var(--danger-color);
    }

    .usage-badge.premium {
      background-color: rgba(234, 179, 8, 0.1);
      border-color: #eab308;
      color: #eab308;
    }

    /* رسائل الشات */
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .message {
      max-width: 80%;
      padding: 1rem;
      border-radius: 12px;
      line-height: 1.6;
      font-size: 0.95rem;
      word-wrap: break-word;
    }

    .message.user {
      background-color: var(--accent-color);
      color: white;
      align-self: flex-start;
      border-bottom-right-radius: 2px;
    }

    .message.assistant {
      background-color: var(--sidebar-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      align-self: flex-end;
      border-bottom-left-radius: 2px;
      width: 100%;
      max-width: 100%;
    }

    /* صندوق الإدخال */
    .chat-input-area {
      padding: 1.5rem;
      border-top: 1px solid var(--border-color);
      background-color: var(--chat-bg);
    }

    .input-wrapper {
      display: flex;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 0.5rem 1rem;
      align-items: center;
    }

    .input-wrapper:focus-within {
      border-color: var(--accent-color);
    }

    #message-input {
      flex: 1;
      background: none;
      border: none;
      color: #fff;
      font-size: 1rem;
      resize: none;
      max-height: 150px;
      outline: none;
      padding: 0.5rem 0;
    }

    #send-btn {
      background-color: var(--accent-color);
      color: white;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    #send-btn:hover {
      background-color: var(--accent-hover);
    }

    #send-btn:disabled {
      background-color: var(--border-color);
      cursor: not-allowed;
    }

    /* مؤشر الكتابة */
    .typing-dots {
      display: flex;
      gap: 4px;
      padding: 0.5rem 0;
    }

    .typing-dots span {
      width: 8px;
      height: 8px;
      background-color: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
    .typing-dots span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1.0); }
    }

    /* نافذة الدفع / الاشتراك (Modal) */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal-card {
      background-color: var(--sidebar-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .modal-card h2 {
      margin-bottom: 0.5rem;
      color: #fff;
    }

    .modal-card p {
      color: var(--text-muted);
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }

    .plans-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .sub-plan {
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .sub-plan.featured {
      border-color: var(--accent-color);
    }

    .sub-plan h4 {
      color: #fff;
      font-size: 1.1rem;
    }

    .sub-plan .price {
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--accent-color);
      margin-bottom: 0.5rem;
    }

    .sub-plan-btn {
      padding: 0.5rem;
      background-color: var(--accent-color);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .sub-plan-btn:hover {
      background-color: var(--accent-hover);
    }

    .close-modal {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
      text-decoration: underline;
    }

    /* تصميم متجاوب للموبايل */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        right: -280px;
        top: 0;
        bottom: 0;
      }
      .sidebar.open {
        right: 0;
      }
      #toggle-sidebar {
        display: block;
      }
      .sidebar-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background-color: rgba(0,0,0,0.5);
        z-index: 99;
      }
      .sidebar-overlay.show {
        display: block;
      }
      .plans-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- شاشة تسجيل الدخول -->
  <div id="auth-screen">
    <div class="auth-card">
      <h2 id="auth-title">تسجيل الدخول</h2>
      <input type="email" id="auth-email" class="auth-input" placeholder="البريد الإلكتروني" />
      <input type="password" id="auth-password" class="auth-input" placeholder="كلمة المرور" />
      <button id="auth-submit-btn" class="auth-btn">دخول</button>
      <div class="auth-toggle" id="auth-toggle-btn">ليس لديك حساب؟ <span>إنشاء حساب جديد</span></div>
    </div>
  </div>

  <!-- تطبيق الشات الرئيسي -->
  <div id="app-container">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    
    <!-- الشريط الجانبي -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button class="new-chat-btn" id="new-chat-btn">
          <i class="fas fa-plus"></i> محادثة جديدة
        </button>
      </div>
      <div class="conversations-list" id="conversations-list">
        <!-- المحادثات تظهر هنا ديناميكياً -->
      </div>
      <div class="sidebar-footer">
        <button class="logout-btn" id="logout-btn">
          <i class="fas fa-sign-out-alt"></i> تسجيل الخروج
        </button>
      </div>
    </aside>

    <!-- واجهة الشات الأساسية -->
    <main class="chat-main">
      <header class="chat-header">
        <button id="toggle-sidebar" type="button" aria-label="القائمة">
          <i class="fas fa-bars"></i>
        </button>
        <h3>Smart AI</h3>
        <div id="usage-badge" class="usage-badge">جاري التحميل...</div>
      </header>

      <div class="messages-container" id="messages-container">
        <!-- الرسائل تظهر هنا -->
      </div>

      <div class="chat-input-area">
        <div class="input-wrapper">
          <textarea id="message-input" rows="1" placeholder="اكتب رسالتك هنا..."></textarea>
          <button id="send-btn" type="button" aria-label="إرسال">
            <i class="fas fa-paper-plane"></i>
          </button>
        </div>
      </div>
    </main>
  </div>

  <!-- نافذة الاشتراك عند انتهاء الرسائل المجانية -->
  <div class="modal-overlay" id="sub-modal">
    <div class="modal-card">
      <h2>انتهت رسائلك المجانية</h2>
      <p id="sub-limit-msg">لقد استنفدت الحد اليومي المجاني (7 رسائل). اشترك الآن للاستمرار بلا حدود!</p>
      
      <div class="plans-grid">
        <div class="sub-plan">
          <h4>اشتراك شهري</h4>
          <div class="price">$10 / شهرياً</div>
          <button class="sub-plan-btn" onclick="selectPlan('monthly')">اشترك الآن</button>
        </div>
        <div class="sub-plan featured">
          <h4>اشتراك سنوي</h4>
          <div class="price">$110 / سنوياً</div>
          <button class="sub-plan-btn" onclick="selectPlan('yearly')">اشترك الآن</button>
        </div>
      </div>

      <button class="close-modal" onclick="closeSubModal()">إغلاق ومتابعة لاحقاً</button>
    </div>
  </div>

  <!-- سكربت التطبيق -->
  <script src="/app.js"></script>
</body>
</html>
