<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart AI</title>
  
  <!-- CSS Fonts & Styles -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
  
  <!-- JavaScript Markdown & Syntax Highlighting Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #6366f1;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --user-msg-bg: #4f46e5;
      --ai-msg-bg: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      height: 100dvh; /* For mobile viewports */
      overflow: hidden;
    }

    /* Container layout responsive */
    #app-container {
      display: flex;
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* Sidebar logic */
    #sidebar {
      width: 260px;
      background-color: #0b1120;
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease;
      z-index: 100;
    }

    /* Main Chat Area */
    #chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
      background-color: var(--bg-color);
    }

    /* Header */
    header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(8px);
    }

    .mobile-toggle {
      display: none;
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 1.2rem;
      cursor: pointer;
    }

    /* Messages Area */
    #messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.6;
      font-size: 0.95rem;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    .message.user {
      align-self: flex-start;
      background-color: var(--user-msg-bg);
      color: #fff;
      border-bottom-right-radius: 2px;
    }

    .message.assistant {
      align-self: flex-end;
      background-color: var(--ai-msg-bg);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 2px;
    }

    /* Formatting for Markdown Code Blocks */
    .message pre {
      background-color: #090d16 !important;
      border-radius: 8px;
      padding: 12px;
      margin: 10px 0;
      overflow-x: auto;
      direction: ltr;
      text-align: left;
      border: 1px solid #1e293b;
    }

    .message code {
      font-family: 'Fira Code', Consolas, Monaco, monospace;
      font-size: 0.88rem;
    }

    .message :not(pre) > code {
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      direction: ltr;
      display: inline-block;
    }

    .message img.generated-img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 8px;
    }

    /* Input Controls */
    #input-area {
      padding: 12px 16px;
      background-color: var(--card-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 8px;
      align-items: center;
    }

    #message-input {
      flex: 1;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 12px 16px;
      border-radius: 24px;
      outline: none;
      font-size: 0.95rem;
    }

    #message-input:focus {
      border-color: var(--accent-color);
    }

    .btn-icon {
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-icon:hover {
      opacity: 0.9;
    }

    /* Mobile Responsive Logic */
    @media (max-width: 768px) {
      .mobile-toggle {
        display: block;
      }

      #sidebar {
        position: absolute;
        top: 0;
        bottom: 0;
        right: 0;
        transform: translateX(100%);
      }

      #sidebar.open {
        transform: translateX(0);
      }

      .message {
        max-width: 92%;
      }
    }
  </style>
</head>
<body>

  <div id="app-container">
    <!-- Sidebar -->
    <div id="sidebar">
      <div style="padding: 16px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
        <h3 style="font-size: 1.1rem;">المحادثات</h3>
        <button id="new-chat-btn" style="background: var(--accent-color); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer;">جديد +</button>
      </div>
      <div id="conversations-list" style="flex: 1; overflow-y: auto; padding: 10px;"></div>
    </div>

    <!-- Main Chat Window -->
    <div id="chat-main">
      <header>
        <button class="mobile-toggle" id="toggle-sidebar"><i class="fas fa-bars"></i></button>
        <h2 style="font-size: 1.1rem; font-weight: 600;">Smart AI</h2>
        <div style="width: 24px;"></div>
      </header>

      <div id="messages-container"></div>

      <div id="input-area">
        <input type="text" id="message-input" placeholder="اكتب رسالتك أو وصف الصورة هنا..." />
        <button class="btn-icon" id="send-btn" title="إرسال"><i class="fas fa-paper-plane"></i></button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
