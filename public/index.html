<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart AI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    /* ضع هنا ملف الـ CSS الأصلي الخاص بك تماماً كما كان قبل التعديل */
    :root {
      --bg-color: #131314;
      --sidebar-bg: #1e1f20;
      --chat-bg: #131314;
      --input-bg: #282a2c;
      --text-color: #e3e3e3;
      --text-muted: #8e918f;
      --accent-color: #8ab4f8;
      --border-color: #3c4043;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); height: 100vh; overflow: hidden; }

    #auth-screen { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: var(--bg-color); }
    .auth-card { background-color: var(--sidebar-bg); padding: 2rem; border-radius: 16px; border: 1px solid var(--border-color); width: 100%; max-width: 400px; }
    .auth-card h2 { margin-bottom: 1.5rem; text-align: center; color: #fff; }
    .auth-input { width: 100%; padding: 0.75rem 1rem; margin-bottom: 1rem; background-color: var(--input-bg); border: 1px solid var(--border-color); border-radius: 8px; color: #fff; }
    .auth-btn { width: 100%; padding: 0.75rem; background-color: var(--accent-color); color: #202124; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .auth-toggle { margin-top: 1rem; text-align: center; font-size: 0.9rem; color: var(--text-muted); cursor: pointer; }
    .auth-toggle span { color: var(--accent-color); }

    #app-container { display: none; height: 100vh; display: flex; }
    .sidebar { width: 260px; background-color: var(--sidebar-bg); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; height: 100%; }
    .sidebar-header { padding: 1rem; }
    .new-chat-btn { width: 100%; padding: 0.75rem; background-color: var(--input-bg); border: 1px solid var(--border-color); color: #fff; border-radius: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
    .conversations-list { flex: 1; overflow-y: auto; padding: 0.5rem; }
    .conv-item { padding: 0.75rem 1rem; margin-bottom: 0.25rem; border-radius: 20px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; color: var(--text-color); font-size: 0.9rem; }
    .conv-item:hover { background-color: var(--input-bg); }
    .conv-item.active { background-color: #3b4255; }
    .conv-actions { display: none; }
    .conv-item:hover .conv-actions { display: flex; gap: 0.5rem; }
    .sidebar-footer { padding: 1rem; border-top: 1px solid var(--border-color); }
    .logout-btn { width: 100%; padding: 0.5rem; background: none; border: none; color: #f28b82; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }

    .chat-main { flex: 1; display: flex; flex-direction: column; height: 100%; background-color: var(--chat-bg); position: relative; }
    .chat-header { padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); }
    .chat-header h3 { font-size: 1.1rem; color: #fff; }
    #toggle-sidebar { background: none; border: none; color: #fff; font-size: 1.2rem; cursor: pointer; display: none; }

    /* شارة العداد */
    .usage-badge { background-color: var(--input-bg); border: 1px solid var(--border-color); padding: 0.35rem 0.75rem; border-radius: 20px; font-size: 0.85rem; display: flex; align-items: center; gap: 0.4rem; color: var(--accent-color); }
    .usage-badge.low { border-color: #f28b82; color: #f28b82; }
    .usage-badge.premium { background-color: rgba(253, 214, 99, 0.1); border-color: #fdd663; color: #fdd663; }

    .messages-container { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1.5rem; }
    .message { max-width: 800px; margin: 0 auto; width: 100%; padding: 1rem; line-height: 1.6; }
    .message.user { background-color: var(--input-bg); border-radius: 12px; }
    .message.assistant { background-color: transparent; }

    .chat-input-area { padding: 1.5rem; max-width: 800px; margin: 0 auto; width: 100%; }
    .input-wrapper { display: flex; background-color: var(--input-bg); border: 1px solid var(--border-color); border-radius: 24px; padding: 0.75rem 1.25rem; align-items: center; }
    #message-input { flex: 1; background: none; border: none; color: #fff; font-size: 1rem; resize: none; max-height: 150px; outline: none; }
    #send-btn { background: none; border: none; color: var(--accent-color); font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    #send-btn:disabled { color: var(--text-muted); cursor: not-allowed; }

    .typing-dots { display: flex; gap: 4px; padding: 0.5rem 0; }
    .typing-dots span { width: 8px; height: 8px; background-color: var(--text-muted); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }

    /* نافذة الاشتراك Modal */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
    .modal-overlay.show { display: flex; }
    .modal-card { background-color: var(--sidebar-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 2rem; width: 100%; max-width: 480px; text-align: center; }
    .modal-card h2 { margin-bottom: 0.5rem; color: #fff; }
    .modal-card p { color: var(--text-muted); margin-bottom: 1.5rem; }
    .plans-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem; }
    .sub-plan { background-color: var(--input-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.25rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .sub-plan.featured { border-color: var(--accent-color); }
    .sub-plan h4 { color: #fff; }
    .sub-plan .price { font-size: 1.2rem; font-weight: bold; color: var(--accent-color); margin-bottom: 0.5rem; }
    .sub-plan-btn { padding: 0.6rem; background-color: var(--accent-color); color: #202124; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .close-modal { background: none; border: none; color: var(--text-muted); cursor: pointer; text-decoration: underline; }

    @media (max-width: 768px) {
      .sidebar { position: fixed; right: -260px; top: 0; bottom: 0; z-index: 100; transition: right 0.3s; }
      .sidebar.open { right: 0; }
      #toggle-sidebar { display: block; }
      .plans-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div id="auth-screen">
    <div class="auth-card">
      <h2 id="auth-title">تسجيل الدخول</h2>
      <input type="email" id="auth-email" class="auth-input" placeholder="البريد الإلكتروني" />
      <input type="password" id="auth-password" class="auth-input" placeholder="كلمة المرور" />
      <button id="auth-submit-btn" class="auth-btn">دخول</button>
      <div class="auth-toggle" id="auth-toggle-btn">ليس لديك حساب؟ <span>إنشاء حساب جديد</span></div>
    </div>
  </div>

  <div id="app-container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button class="new-chat-btn" id="new-chat-btn">
          <i class="fas fa-plus"></i> محادثة جديدة
        </button>
      </div>
      <div class="conversations-list" id="conversations-list"></div>
      <div class="sidebar-footer">
        <button class="logout-btn" id="logout-btn">
          <i class="fas fa-sign-out-alt"></i> تسجيل الخروج
        </button>
      </div>
    </aside>

    <main class="chat-main">
      <header class="chat-header">
        <button id="toggle-sidebar" type="button" aria-label="القائمة">
          <i class="fas fa-bars"></i>
        </button>
        <h3>Smart AI</h3>
        <div id="usage-badge" class="usage-badge">جاري التحميل...</div>
      </header>

      <div class="messages-container" id="messages-container"></div>

      <div class="chat-input-area">
        <div class="input-wrapper">
          <textarea id="message-input" rows="1" placeholder="اسأل Smart AI..."></textarea>
          <button id="send-btn" type="button" aria-label="إرسال">
            <i class="fas fa-paper-plane"></i>
          </button>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="sub-modal">
    <div class="modal-card">
      <h2>انتهت رسائلك المجانية</h2>
      <p id="sub-limit-msg">لقد استنفدت الحد اليومي (7 رسائل). اشترك الآن للاستمرار بلا حدود!</p>
      
      <div class="plans-grid">
        <div class="sub-plan">
          <h4>اشتراك شهري</h4>
          <div class="price">$10 / شهرياً</div>
          <button class="sub-plan-btn" onclick="selectPlan('monthly')">اشترك الآن</button>
        </div>
        <div class="sub-plan featured">
          <h4>اشتراك سنوي</h4>
          <div class="price">$110 / سنوياً</div>
          <button class="sub-plan-btn" onclick="selectPlan('yearly')">اشترك الآن</button>
        </div>
      </div>

      <button class="close-modal" onclick="closeSubModal()">إغلاق</button>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
