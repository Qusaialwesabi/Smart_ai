<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart AI</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
  
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

  <style>
    :root {
      --bg-color: #0f172a; --card-bg: #1e293b; --accent-color: #6366f1;
      --text-main: #f8fafc; --text-muted: #94a3b8; --border-color: #334155;
      --user-msg-bg: #4f46e5; --ai-msg-bg: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; height: 100dvh; overflow: hidden; }

    /* Auth Screen */
    #auth-screen { position: fixed; inset: 0; background: var(--bg-color); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .auth-card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 30px; border-radius: 16px; width: 100%; max-width: 400px; text-align: center; }
    .auth-card h2 { margin-bottom: 20px; }
    .auth-card input { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: #fff; outline: none; }
    .auth-card button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: var(--accent-color); color: #fff; font-weight: bold; cursor: pointer; margin-top: 8px; }
    .auth-toggle { margin-top: 15px; font-size: 0.88rem; color: var(--text-muted); cursor: pointer; }
    .auth-toggle span { color: var(--accent-color); text-decoration: underline; }

    #app-container { display: flex; width: 100%; height: 100%; position: relative; }
    
    #sidebar { width: 280px; background-color: #0b1120; border-left: 1px solid var(--border-color); display: flex; flex-direction: column; transition: transform 0.3s ease; z-index: 100; flex-shrink: 0; }
    
    /* Chat Area */
    #chat-main { flex: 1; display: flex; flex-direction: column; height: 100%; background-color: var(--bg-color); min-width: 0; }
    header { padding: 12px 16px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; background: rgba(15, 23, 42, 0.9); }
    .mobile-toggle { display: none; background: none; border: none; color: var(--text-main); font-size: 1.2rem; cursor: pointer; }
    
    #messages-container { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
    
    .message { max-width: 90%; padding: 12px 16px; border-radius: 12px; line-height: 1.6; overflow-wrap: break-word; word-break: break-word; }
    .message.user { align-self: flex-start; background-color: var(--user-msg-bg); color: #fff; }
    .message.assistant { align-self: flex-end; background-color: var(--ai-msg-bg); border: 1px solid var(--border-color); width: 100%; }

    /* Fix CSS for Code Blocks */
    .message pre { background: #090d16 !important; padding: 12px; border-radius: 8px; margin: 10px 0; overflow-x: auto; max-width: 100%; direction: ltr; text-align: left; }
    .message code { font-family: monospace; white-space: pre-wrap; }
    .message pre code { white-space: pre; } /* الأكواد داخل الصندوق الأسود تأخذ سكرول خاص بها */

    #input-area { padding: 12px 16px; background-color: var(--card-bg); border-top: 1px solid var(--border-color); display: flex; gap: 8px; align-items: center; }
    #message-input { flex: 1; background-color: var(--bg-color); border: 1px solid var(--border-color); color: #fff; padding: 12px 16px; border-radius: 24px; outline: none; }
    .btn-icon { background-color: var(--accent-color); color: #fff; border: none; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }

    /* Sidebar Items */
    .conv-item { padding: 10px; border-radius: 8px; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; color: var(--text-muted); cursor: pointer; gap: 8px; transition: 0.2s; }
    .conv-item.active { background: var(--card-bg); color: #fff; border-right: 3px solid var(--accent-color); }
    .conv-item:hover { background: rgba(255,255,255,0.05); }
    .conv-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
    
    .conv-actions { display: flex; gap: 10px; opacity: 0.6; }
    .conv-item:hover .conv-actions { opacity: 1; }
    .conv-actions i { cursor: pointer; transition: 0.2s; }
    .conv-actions .edit-btn:hover { color: #3b82f6; }
    .conv-actions .del-btn:hover { color: #ef4444; }

    @media (max-width: 768px) {
      .mobile-toggle { display: block; }
      #sidebar { position: absolute; top: 0; bottom: 0; right: 0; transform: translateX(100%); width: 260px; }
      #sidebar.open { transform: translateX(0); }
      .message { max-width: 95%; }
    }
  </style>
</head>
<body>

  <div id="auth-screen">
    <div class="auth-card">
      <h2 id="auth-title">تسجيل الدخول</h2>
      <input type="email" id="auth-email" placeholder="البريد الإلكتروني" />
      <input type="password" id="auth-password" placeholder="كلمة المرور" />
      <button id="auth-submit-btn">دخول</button>
      <div class="auth-toggle" id="auth-toggle-btn">ليس لديك حساب؟ <span>إنشاء حساب جديد</span></div>
    </div>
  </div>

  <div id="app-container" style="display: none;">
    <div id="sidebar">
      <div style="padding: 16px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
        <h3 style="font-size: 1.1rem;">المحادثات</h3>
        <button id="new-chat-btn" style="background: var(--accent-color); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer;">جديد +</button>
      </div>
      <div id="conversations-list" style="flex: 1; overflow-y: auto; padding: 10px;"></div>
      <div style="padding: 16px; border-top: 1px solid var(--border-color);">
        <button id="logout-btn" style="width: 100%; background: #ef4444; color: white; border: none; padding: 8px; border-radius: 6px; cursor: pointer;">تسجيل الخروج</button>
      </div>
    </div>

    <div id="chat-main">
      <header>
        <button class="mobile-toggle" id="toggle-sidebar"><i class="fas fa-bars"></i></button>
        <h2 style="font-size: 1.1rem; font-weight: 600;">Smart AI</h2>
        <div style="width: 24px;"></div>
      </header>

      <div id="messages-container"></div>

      <div id="input-area">
        <input type="text" id="message-input" placeholder="اكتب رسالتك هنا..." />
        <button class="btn-icon" id="send-btn" title="إرسال"><i class="fas fa-paper-plane"></i></button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
